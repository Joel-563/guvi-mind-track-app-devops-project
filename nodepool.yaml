apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: test
spec:
  limits:
      cpu: "2"

  disruption:
    budgets:
    - nodes: 10%
    consolidateAfter: 2m
    consolidationPolicy: WhenEmptyOrUnderutilized

  template:
    metadata:
      labels:
        dedicated: test
    spec:
      expireAfter: 720h
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
      - key: karpenter.k8s.aws/instance-family
        operator: In
        values:
        - t3

      - key: node.kubernetes.io/instance-type
        operator: In
        values:
        - t3.small

      - key: karpenter.sh/capacity-type
        operator: In
        values:
        - on-demand

      - key: kubernetes.io/arch
        operator: In
        values:
        - amd64

      - key: topology.kubernetes.io/zone
        operator: In
        values:
        - ap-southeast-1a
        #- ap-southeast-1b
        #- ap-southeast-1c

      taints:
      - effect: NoSchedule
        key: dedicated
        value: test